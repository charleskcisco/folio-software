[package]
name = "folio-desktop"
version = "0.1.0"
description = "Folio — distraction-free composition"
authors = ["Charles Cisco"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs-next = "2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The pty bridge. portable-pty is wezterm's, which is the most exercised
# implementation on Windows -- where a pty means ConPTY and the naive
# approaches do not work.
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Raw Objective-C messaging, for the one AppKit property Tauri does not
# surface (see disable_writing_tools in src/lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
