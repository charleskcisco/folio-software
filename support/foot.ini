[main]
# Let foot draw box-drawing characters itself rather than taking
# them from the font. This is foot's default, but stated so it
# cannot drift: a font's own glyphs do not span the full cell, so
# Folio's panel dividers come out dashed instead of continuous.
box-drawings-uses-font-glyphs=no
font=Noto Sans Mono:size=13:antialias=true:hintig=true

[mouse]
hide-when-typing=true
