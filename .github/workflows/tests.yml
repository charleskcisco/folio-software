name: tests

# Journal targets a Linux writerdeck, but the student build has to run on
# macOS and Windows laptops. Windows is the one nobody here has a machine
# for, so this workflow is the only place it gets exercised at all --
# every cross-platform bug found so far (cp1252 defaults, filenames with
# a colon) was invisible on a Mac and would have shipped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    env:
      # The inline `shell: python` steps run from a temp file, so the
      # checkout is not on sys.path and `import folio` fails.
      PYTHONPATH: ${{ github.workspace }}

      # Console encoding only. Windows defaults stdout to cp1252, so the
      # suite's own progress output dies on its first tick mark -- which
      # says nothing about the code under test.
      #
      # Deliberately NOT PYTHONUTF8/-X utf8: that would switch the
      # *file* encoding default to UTF-8 as well and quietly make this
      # whole job stop testing the thing it exists to test.
      PYTHONIOENCODING: utf-8

    strategy:
      # Don't let the first red platform cancel the others: when Windows
      # breaks we want to know whether Linux and macOS broke with it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet prompt_toolkit pygments

      # The import alone is a real test on Windows: it is where a missing
      # termios guard or a module-level POSIX call takes the app down
      # before it can draw a frame.
      - name: Import folio
        run: python -c "import folio; print('import OK')"

      # -X warn_default_encoding turns locale-dependent text I/O into a
      # visible warning, and -W error promotes it to a failure. This is
      # the guard that would have caught the cp1252 export bug the day it
      # was written rather than on a student's laptop.
      - name: Run test suite
        run: python -X warn_default_encoding -W error::EncodingWarning test_folio.py

      # A first run has no config and must not stop to ask a question --
      # it should create its own vault and be ready to open it. Uses a
      # temporary HOME so the runner's real one is left alone.
      - name: First-run creates a vault unattended
        shell: python
        run: |
          import os, tempfile, pathlib, sys
          with tempfile.TemporaryDirectory() as home:
              os.environ["HOME"] = home              # POSIX
              os.environ["USERPROFILE"] = home       # Windows
              os.environ["APPDATA"] = str(pathlib.Path(home) / "AppData" / "Roaming")
              import folio
              vault = folio._default_vault()
              assert str(vault).startswith(home), (vault, home)
              vault.mkdir(parents=True, exist_ok=True)
              folio._save_config({"vault": str(vault)})
              assert folio._load_config()["vault"] == str(vault)
              assert folio._config_path().exists(), folio._config_path()
              print("first-run OK ->", vault)

      # The bug this exists to catch: a note title with a colon in it is
      # ordinary on a Mac and illegal on Windows.
      - name: Note titles with illegal characters
        shell: python
        run: |
          import tempfile, pathlib
          import folio
          with tempfile.TemporaryDirectory() as td:
              storage = folio.VaultStorage(pathlib.Path(td))
              for title in ("Chapter 1: The Beginning", "What? Why!", "NUL", "draft."):
                  entry = storage.create_entry(title)
                  assert entry.path.exists(), title
              print("filename sanitisation OK on this platform")
