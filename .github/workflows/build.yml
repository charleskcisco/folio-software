name: build

# Windows is why this workflow exists. PyInstaller freezes for the
# architecture of the interpreter running it, and nobody here has a
# Windows machine, so this is the only place a Windows build comes from.
#
# The Macs are built and signed locally instead. Intel needed a runner too
# until macos-13 was retired: every replacement Intel image is a "larger
# runner", and those are billed even on public repositories. The local
# route is an x86_64 Python under Rosetta -- see freeze.sh and
# FOLIO_TOOLS_DIR -- which costs nothing and puts the build on the machine
# holding the signing certificate anyway.
#
# The macOS job here is a canary, not a source of artifacts: it proves the
# build still works from a clean checkout with no local state.
#
# Not run on every push: a build is ~100MB per platform and takes minutes.
# Tag a release, or start it by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Pinned rather than "latest from a package manager". These two binaries
# are inside every exported document: pandoc reads the markdown and typst
# sets the page. A runner silently moving to a new typst would change the
# typography of every PDF with nothing in the diff to explain it.
env:
  PANDOC_VERSION: '3.10'
  TYPST_VERSION: 'v0.15.1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: when Windows
      # breaks we still want to know whether the Macs built.
      fail-fast: false
      matrix:
        include:
          # Clean-checkout build check. macos-14 is deprecated and
          # macos-13 is gone, so this tracks the current GA image.
          - os: macos-15
            label: macos-apple-silicon
            triple: aarch64-apple-darwin
          - os: windows-latest
            label: windows-x64
            triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      # The Mac freezes with a python-build-standalone interpreter, the
      # same kind the local release builds use. setup-python's is a
      # framework build, which freezes to a folder carrying
      # Python.framework and its symlinks; freeze.sh refuses that layout
      # because it does not survive signing. uv installs standalone
      # builds, and freeze.sh picks up .venv/bin/python on its own.
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python build dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install --quiet prompt_toolkit pygments pyinstaller

      - name: Install standalone Python and build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          uv venv --managed-python --python 3.12 .venv
          uv pip install --python .venv/bin/python prompt_toolkit pygments pyinstaller

      # Downloaded from the projects' own releases rather than a package
      # manager, so the version is the one named above on every runner.
      # freeze.sh finds them on PATH and embeds them in the frozen binary.
      - name: Install pandoc and typst (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          arch=$([ "${{ matrix.triple }}" = "aarch64-apple-darwin" ] && echo arm64 || echo x86_64)
          curl -fsSL -o pandoc.zip \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-${arch}-macOS.zip"
          unzip -q pandoc.zip
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-${{ matrix.triple }}.tar.xz"
          tar -xJf typst.tar.xz
          mkdir -p "$HOME/tools"
          # Located rather than assumed. The directory inside each archive
          # is the projects' business and has changed before; a hardcoded
          # path turns their next tidy-up into a failed release build.
          cp "$(find . -type f -name pandoc -perm -u+x | head -1)" "$HOME/tools/"
          cp "$(find . -type f -name typst -perm -u+x | head -1)" "$HOME/tools/"
          chmod +x "$HOME/tools/"*
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Install pandoc and typst (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eux
          curl -fsSL -o pandoc.zip \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-windows-x86_64.zip"
          unzip -q pandoc.zip
          curl -fsSL -o typst.zip \
            "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-${{ matrix.triple }}.zip"
          unzip -q typst.zip
          mkdir -p "$HOME/tools"
          # Located rather than assumed; see the macOS step.
          cp "$(find . -type f -name pandoc.exe | head -1)" "$HOME/tools/"
          cp "$(find . -type f -name typst.exe | head -1)" "$HOME/tools/"
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: Verify the bundled tool versions
        shell: bash
        run: |
          pandoc --version | head -1
          typst --version

      # aspell, for spell check; freeze.sh finds it through
      # FOLIO_ASPELL_DIR. The Mac builds it from source with the script
      # the local release builds use. Windows takes MSYS2's and copies out
      # the program, the DLLs it links and its dictionaries into the same
      # layout: bin/ for the program, lib/aspell-0.60/ for the data.
      - name: Build aspell (macOS)
        if: runner.os == 'macOS'
        run: |
          desktop/scripts/build-aspell.sh "$RUNNER_TEMP/aspell"
          echo "FOLIO_ASPELL_DIR=$RUNNER_TEMP/aspell" >> "$GITHUB_ENV"

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-aspell mingw-w64-x86_64-aspell-en

      - name: Assemble aspell (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -eux
          out="$(cygpath -u "$RUNNER_TEMP")/aspell"
          mkdir -p "$out/bin" "$out/lib/aspell-0.60"
          cp /mingw64/bin/aspell.exe "$out/bin/"
          # Asked of aspell rather than assumed, like the pandoc and typst
          # paths above. Data and dictionaries are merged into one
          # directory because folio.py passes the same path for both.
          for key in data-dir dict-dir; do
            cp -r "$(aspell config "$key")"/. "$out/lib/aspell-0.60/"
          done
          # The DLLs that aspell and its filter modules link from MSYS2's
          # tree; the rest belong to Windows. They sit beside aspell.exe,
          # the one directory Windows always searches.
          ldd /mingw64/bin/aspell.exe "$out"/lib/aspell-0.60/*.dll 2>/dev/null \
            | awk '$3 ~ "^/mingw64/" {print $3}' | sort -u \
            | xargs -r cp -t "$out/bin/"
          ls -la "$out/bin"
          echo "FOLIO_ASPELL_DIR=$(cygpath -m "$out")" >> "$GITHUB_ENV"

      # bash on Windows too: the runners ship Git Bash, and freeze.sh
      # handles the platform differences itself (the .exe suffix and
      # PyInstaller's ';' data separator).
      - name: Freeze Folio
        shell: bash
        run: ./freeze.sh

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build the desktop bundle
        working-directory: desktop
        # Unsigned. macOS signing needs a Developer ID certificate and its
        # password in repository secrets; until those exist, signing stays
        # a local step and CI produces artifacts to sign, not shipped ones.
        run: npm run tauri build -- --target ${{ matrix.triple }}

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.label }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
